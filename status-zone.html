<!doctype html>
<meta charset="utf-8">
<title>Status zone below the editor: chosen design</title>
<style>body{background:#191724;margin:24px;font:13px system-ui;color:#908caa}
.wrap{font:12px system-ui;color:#908caa}
.ctl{margin:0 0 8px;display:flex;gap:6px;align-items:center}
.ctl button{font:12px system-ui;background:#1f1d2e;color:#908caa;border:1px solid #393552;border-radius:4px;padding:3px 9px;cursor:pointer;transition:transform 120ms cubic-bezier(.23,1,.32,1)}
.ctl button:active{transform:scale(.97)}
.ctl button[aria-pressed=true]{color:#e0def4;border-color:#6e6a86}
.term{font-family:"JetBrainsMono Nerd Font Mono",ui-monospace,monospace;font-size:15px;line-height:1.75;background:#0a0e14;color:#e0def4;padding:10px 0 12px;border-radius:8px;display:inline-block}
.ln{white-space:pre;padding:0 1ch;height:1.75em}
.ic{font-family:"JetBrainsMono Nerd Font","JetBrainsMono Nerd Font Mono",monospace}
.b{font-weight:700}
.text{color:#e0def4}.muted{color:#908caa}.dim{color:#6e6a86}.border{color:#393552}
.pine{color:#3e8fb0}.foam{color:#9ccfd8}.gold{color:#f6c177}.love{color:#eb6f92}.iris{color:#c4a7e7}.rose{color:#ea9a97}
.pill{background:#2a273f}.cap{color:#2a273f}
.note{margin-top:8px;max-width:760px;line-height:1.5}
.tray{background:#1f1d2e}
.ln.tray{padding:0 1ch}
</style>
<p>Chosen design (owner, 2026-11-07): subagent list below the editor, then the two-row HUD grid, separated from the editor and from each other by blank rows only. Demonstrative data; requires JetBrainsMono Nerd Font installed locally.</p>
<div class="wrap">
<div class="ctl">Terminal width: <button data-cols="120">120 columns</button><button data-cols="80">80 columns</button></div>
<div class="term" id="term"></div>
</div>
<script>
// Demonstrative only: hypothetical data, no runtime behavior.
const I = { folder:'\u{f07b}', branch:'\u{f418}', pr:'\u{f407}', wt:'\u{f0645}', model:'\u{ec20}', think:'\u{f06e8}', ctx:'\u{ee9c}', cache:'\u{f01bc}', warm:'\u{f0954}', cold:'\u{f0717}', work:'\u{f013}', spin:'⠹', ok:'' }
let cols = 120
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
// A segment is [text, classes, isIcon]; width counts code points.
const w = segs => segs.reduce((n,[t]) => n + [...t].length, 0)
const html = segs => segs.map(([t,c,ic]) => `<span class="${c||''}${ic?' ic':''}">${esc(t)}</span>`).join('')
const icon = (g,c) => [[g,c,true],['  ','']]
const gap = n => [[' '.repeat(n),'']]
const join = (groups, n) => groups.filter(g => g.length).flatMap((g,i) => i ? [...gap(n), ...g] : g)
let band = ''
const row = (left, right) => {
  const pad = Math.max(1, cols - 2 - w(left) - w(right))
  return `<div class="ln ${band}">${html([...left, ...gap(pad), ...right])}</div>`
}
const blank = () => `<div class="ln ${band}"></div>`
const gauge = (pct, cells) => {
  const full = Math.round(pct/100*cells), tone = pct >= 85 ? 'love' : pct >= 60 ? 'gold' : 'muted'
  return [['━'.repeat(full), tone], ['─'.repeat(cells-full), 'border']]
}
const narrow = () => cols < 100
const rule = () => `<div class="ln">${html([['─'.repeat(cols-2),'dim']])}</div>`
const editor = () => `<div class="ln">${html([['─'.repeat(cols-2),'iris']])}</div><div class="ln">${html([['▏','text']])}</div><div class="ln">${html([['─'.repeat(cols-2),'iris']])}</div>`
const agentList = () => row(
  [[I.spin,'iris'],['  ',''],['implement','text b'],['  ',''],['fatti di attività live','muted']],
  narrow() ? [['↻27','dim']] : [['opus-5-5','dim'],...gap(3),['↻27 · 27 tool','dim'],...gap(3),['edit src/pi-child.ts','dim']]
)


const compactRows = () => [
  row([[I.folder,'muted',true],['  ',''],['dev','text b'],...gap(3),[I.branch,'muted',true],['  ',''],['feat/monitor','text'],...(narrow()?[]:[...gap(3),[I.pr,'gold',true],['  ',''],['#271','gold']]),...gap(3),['+120','pine'],[' ',''],['−30','love']],
      [['opus-5-5','text'],...gap(2),['high','rose']]),
  row(narrow() ? [] : [['monitor','dim'],...gap(3),[I.wt,'dim',true],['  2','dim']],
      [[I.ctx,'muted',true],['  ',''],...gauge(28, narrow()?6:10),[' 28%','text'],...gap(3),['$0.53','muted'],...(narrow()?[]:[...gap(3),['92%','dim']]),...gap(3),[I.warm,'muted',true],['  3:12','muted'],...(narrow()?[]:[...gap(3),['⡀⣀⣄⣤⣦⣶⣷⣿','dim']])])]
const variants = {
  now: () => { band = ''; return [editor(), agentList(), rule(), ...compactRows()] },
  gap: () => { band = ''; return [editor(), blank(), agentList(), blank(), ...compactRows()] },
  tray: () => { band = ''; const e = editor(); band = 'tray'; return [e, blank(), agentList(), blank(), ...compactRows(), blank()] },
  tray2: () => { band = ''; const e = editor(); band = 'tray'; return [e, blank(), agentList(), `<div class="ln tray">${html([['─'.repeat(cols-2),'border']])}</div>`, ...compactRows(), blank()] },
}
const render = () => {
  const v = 'gap'
  document.getElementById('term').innerHTML = (variants[v] || variants.now)().join('')
  document.querySelectorAll('[data-cols]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.cols === cols)))
}
document.addEventListener('click', e => { const c = e.target.dataset?.cols; if (c) { cols = +c; render() } })
render()

</script>
